<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07131E">
<meta name="description" content="A tiny lighthouse. An endless ocean. Seven nights to bring back the Sun.">
<title>Last Light | A Lighthouse Adventure</title>
<link rel="stylesheet" href="./styles.css">
<script>window.addEventListener('error',function(e){var s=document.getElementById('bootstrap-status');if(s&&!s.hidden)s.textContent='The lighthouse could not start. Please reload this page.';});window.addEventListener('unhandledrejection',function(){var s=document.getElementById('bootstrap-status');if(s&&!s.hidden)s.textContent='The lighthouse could not start. Please reload this page.';});setTimeout(function(){var s=document.getElementById('bootstrap-status');if(s&&!s.hidden)s.textContent='The lighthouse is taking longer than expected. Try reloading the page or serving it over HTTP.';},7000);</script>
<script type="module" src="./src/main.js"></script>
</head>
<body>
<main id="game-shell" aria-label="Last Light game">
<canvas id="game-canvas" width="390" height="844" aria-label="Lighthouse arena. Drag to aim, hold to shine, release to recharge.">Your browser needs HTML Canvas to play Last Light.</canvas>
<div id="hud" class="hud" hidden>
 <div class="hud-top"><div><span id="hud-night">NIGHT 1</span><span id="hud-score">SCORE 0</span></div><button id="pause-button" class="pause-button" aria-label="Pause game">II <span>PAUSE</span></button></div>
 <div class="hud-bars"><div class="meter-label"><span>INTEGRITY</span><b id="hud-integrity">10/10</b></div><div class="integrity-markers" aria-hidden="true">▰ ▰ ▰ ▰ ▰</div><div class="meter-label"><span>LIGHT</span><b id="hud-light">100/100</b></div><div class="meter-track"><div id="hud-light-bar" class="meter-fill"></div></div></div>
 <div class="hud-bottom"><span id="hud-starlight">STARLIGHT 0</span><span id="hud-time">28s</span></div>
</div>
<div id="countdown" class="countdown" hidden aria-live="polite">3</div>
<div id="overlay" class="overlay"></div>
<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
<div id="bootstrap-status" class="bootstrap-status" role="status">Loading the lighthouse...</div>
</main>
</body>
</html>
