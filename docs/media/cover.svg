<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-labelledby="title desc">
<title id="title">Last Light, a lighthouse adventure</title><desc id="desc">Antique nautical chart in midnight blue and brass, showing a lighthouse beam across a dark sea.</desc>
<defs>
 <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#07131e"/><stop offset="1" stop-color="#163846"/></linearGradient>
 <linearGradient id="beam" x1="0" x2="1" y1="0" y2="0"><stop stop-color="#fff0c0" stop-opacity=".68"/><stop offset=".37" stop-color="#f5c875" stop-opacity=".24"/><stop offset="1" stop-color="#edb65c" stop-opacity="0"/></linearGradient>
 <linearGradient id="sea" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#2a5360"/><stop offset="1" stop-color="#081b28"/></linearGradient>
 <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M 42 0 L 0 0 0 42" stroke="#c4b184" stroke-width=".7" opacity=".12" fill="none"/></pattern>
 <pattern id="waves" width="130" height="35" patternUnits="userSpaceOnUse"><path d="M-20 23 Q 12 11 45 22 T 110 23 T 165 23" fill="none" stroke="#acc2bc" stroke-width="1" opacity=".22"/></pattern>
 <radialGradient id="glow"><stop stop-color="#ffe5a0" stop-opacity=".65"/><stop offset="1" stop-color="#ffe5a0" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1100" height="350" fill="url(#sky)"/>
<rect width="1100" height="350" fill="url(#grid)"/>
<path d="M 0 246 Q 120 226 242 255 T 498 252 T 742 241 T 1100 244 L1100 350 H0 Z" fill="url(#sea)"/>
<rect y="253" width="1100" height="97" fill="url(#waves)"/>
<g fill="none" stroke="#c2aa76" opacity=".23" stroke-width="1"><circle cx="867" cy="178" r="141"/><circle cx="867" cy="178" r="116"/><circle cx="867" cy="178" r="95"/><path d="M867 10V346 M699 178H1092 M751 62L983 294 M983 62L751 294"/></g>
<g fill="#d8bb7c" opacity=".55"><path d="M 870 26 l 4 12 -4 12 -4 -12z"/><path d="M 1020 180 l -12 4 -12 -4 12 -4z"/><circle cx="966" cy="48" r="1.6"/><circle cx="736" cy="74" r="1.3"/><circle cx="1037" cy="114" r="2"/><circle cx="654" cy="44" r="1.2"/></g>
<path d="M 861 149 L 625 65 L 625 225 Z" fill="url(#beam)" opacity=".85"/>
<ellipse cx="861" cy="149" rx="92" ry="92" fill="url(#glow)"/>
<g><path d="M 835 251 L 841 153 L 854 153 L 863 251 Z" fill="#a7b9b4" stroke="#e0d4b5" stroke-width="2"/><path d="M 837 225 H862 M840 194 H858" stroke="#435d65" stroke-width="6"/><rect x="831" y="143" width="35" height="10" rx="1" fill="#162935" stroke="#e4cb91" stroke-width="2"/><rect x="837" y="115" width="23" height="27" fill="#e6b667" stroke="#ffefd2" stroke-width="2"/><rect x="842" y="120" width="13" height="16" fill="#fff0b8"/><path d="M826 114 L848 101 L871 114 Z" fill="#07141f" stroke="#d8bc88" stroke-width="2"/><path d="M 848 101 V 92" stroke="#d6b77e" stroke-width="2"/><path d="M 820 251 Q 849 238 878 251 L892 265 H808Z" fill="#263b3f" stroke="#789088" stroke-width="2"/><rect x="844" y="226" width="8" height="23" fill="#0c2530"/></g>
<g fill="none" stroke="#d4a96d" opacity=".38"><path d="M765 284 q12 -7 24 0 M 919 299 q13 -8 27 0 M700 309 q18 -6 36 0"/><path d="M 906 278 l 10 4 10 -4 -4 6 h-11z" fill="#dfbd7f"/></g>
<rect x="13" y="13" width="1074" height="324" fill="none" stroke="#c3a56f" stroke-width="1.2" opacity=".8"/>
<path d="M24 22h48 M24 22v39 M1076 22h-48 M1076 22v39 M24 328h48 M24 328v-39 M1076 328h-48 M1076 328v-39" fill="none" stroke="#d8bb83" stroke-width="3" opacity=".8"/>
<text x="65" y="76" font-family="Georgia,Palatino,serif" font-size="15" letter-spacing="5" fill="#b8c9c3">THE KEEPER'S CHART</text>
<path d="M65 88 H 460" stroke="#baa372" stroke-width="1" opacity=".65"/>
<text x="60" y="179" font-family="Georgia,Palatino,serif" font-size="100" font-weight="bold" letter-spacing="-6" fill="#f7e8c9">LAST LIGHT</text>
<text x="67" y="221" font-family="Georgia,Palatino,serif" font-style="italic" font-size="21" fill="#d5d3b9">Seven nights to bring back the Sun.</text>
<path d="M67 249 H 475" stroke="#baa372" stroke-width="1" opacity=".65"/>
<text x="67" y="276" font-family="Verdana,Arial,sans-serif" font-size="12" letter-spacing="3" fill="#c5d0c8">A LIGHTHOUSE ADVENTURE</text>
<text x="67" y="308" font-family="Georgia,Palatino,serif" font-size="13" fill="#cfaf78">EST. AFTER THE LAST SUNSET</text>
</svg>